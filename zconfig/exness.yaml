# Exness overlay — deep-merged over config.yaml (see mt5-credentials.yaml's
# exness.config: key and AppConfig.from_yaml's _deep_merge call).
#
# Calibrated for real self-funded money (same treatment as zconfig/fbs.yaml,
# 2026-07-26) rather than a prop-firm evaluation, so there's no external
# daily/max-loss cap to match — just a sane real circuit breaker.
#
# daily_loss_limit_rule (src/risk/rules.py) hard-stops new trades at 95% of
# max_daily_loss_percent, so:
#   max_daily_loss_percent: 10.0, max_losing_streak: 4 -> per-trade risk
#   = 10/4 = 2.5%, real stop at 9.5% (a bad day halts after ~4 losses,
#   never wipes the deposit in one session).
#
# Set directly here rather than via risk_mode: conservative, since that
# overlay doesn't land on 2.5%/trade.
risk:
  max_daily_loss_percent: 10.0
  max_losing_streak: 4
