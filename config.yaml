signal_engine:
  ws_url: ws://localhost:8765
  symbols:
    - XAUUSD
    - US100
    - US30
    - EURUSD
    - GBPUSD
    - USDJPY
mt5:
  use: fbs
risk:
  # Aligned with signal-engine circuit_breaker.max_consecutive_losses=10.
  # Streak analysis (3yr, 5269 trades) proved losses are i.i.d. — stopping
  # at 3 was pausing the engine inside random variance with no edge benefit.
  max_losing_streak: 10
  max_daily_loss_percent: 40
  max_exposure_per_symbol: 2
  min_rr_ratio: 1.0
  max_lot_size: 100.0
  min_lot_size: 0.01
  sl_ratio_threshold: 0.35
  # Recalibrated 2026-08-02 against pure_crt's own real 2022-2023 FBS
  # reconfirm data (4h/6min, the actual live combo) — the previous 0.55
  # for XAUUSD/US100/US30 was CRT-era (30min/1h combo, a retired
  # strategy) and was never re-measured for pure_crt. All six symbols
  # pure_crt actually trades show a strikingly consistent real spread/SL
  # profile under this combo: median ~16-22%, p90 ~30-33%, p95 ~32-35%
  # (n=1263-1714 trades each) - materially tighter than 0.55 ever
  # reflected, and homogeneous enough across symbols that one shared
  # value is the honest calibration, not six different guesses. 0.40 sits
  # just above every symbol's own p95, rejecting only 0.45-2.32% of real
  # historical trades per symbol (the true tail: outlier-spread
  # conditions, not normal trading) - same "trim the worst ~5%, don't
  # touch the median" principle the old values were meant to follow, just
  # actually measured against the strategy that's live now.
  symbol_sl_ratio_threshold:
    XAUUSD: 0.40
    US100: 0.40
    US30: 0.40
    EURUSD: 0.40
    GBPUSD: 0.40
    USDJPY: 0.40
  # Per-symbol risk_amount multiplier (optional, defaults to 1.0 for any
  # symbol not listed) - composes with the cluster/equity-throttle
  # multipliers, applied in TradePlanner.plan(). Example only; not yet
  # calibrated against real per-symbol volatility data.
  symbol_risk_multiplier: {}
  # Balance-tiered risk ceiling (optional - defaults shown are also the
  # fallback if this whole section is omitted). Caps risk_amount at
  # balance * cap_pct/100 on top of the existing daily-budget sizing:
  # any balance <= base_threshold uses base_cap_pct; above it, the cap
  # halves for every doubling of balance, down to floor_pct.
  balance_tier_base_threshold: 500.0
  balance_tier_base_cap_pct: 3.0
  balance_tier_floor_pct: 0.25
  no_hedging: true
  # Profit drawdown guard — pauses until midnight if today's closed P&L gives
  # back this % of start-of-day equity from its session peak. Dormant until
  # the first profitable close (nothing to protect until gains are banked).
  # Set to 0 to disable.
  max_profit_drawdown_percent: 50.0
  rolling_window_size: 2
  rolling_drawdown_pct: 10.0
  # Equity-curve risk throttle — halves position risk while recent realized
  # results sit deep below their rolling peak, restoring full size on
  # recovery. Thresholds and window are platform-managed; `enabled` is the
  # only user-facing knob.
  equity_throttle:
    enabled: true
    drawdown_threshold_r: 8.0
    release_threshold_r: 6.0
    risk_multiplier: 0.5
    window_days: 30
  # Entry-drift diagnostic — measures how far the live fill price has moved
  # AGAINST the signal's own entry (a favorable move, e.g. a pullback before
  # a LONG fills, never counts), as % of the signal's own risk distance.
  # Always measured/logged regardless of `enabled`; only rejects on that
  # basis (separately from min_rr_ratio) when enabled. Starts disabled so
  # nothing about current accept/reject behavior changes until this is
  # deliberately turned on and tuned against real rejection data.
  entry_drift:
    enabled: false
    max_drift_pct_of_risk: 25.0
  cluster_risk:
    enabled: false
    groups:
      - name: forex
        symbols: [EURUSD, GBPUSD, USDJPY]
        max_same_day_loss_r: 2.0
        max_concurrent_positions: 3
        max_same_day_losses: 3
        after_first_loss_risk_multiplier: 0.75
        min_trade_risk_multiplier: 0.25
      - name: indices
        symbols: [US100, US30]
        max_same_day_loss_r: 1.5
        max_concurrent_positions: 1
        max_same_day_losses: 2
        after_first_loss_risk_multiplier: 0.5
        min_trade_risk_multiplier: 0.25
      - name: metals
        symbols: [XAUUSD]
        max_same_day_loss_r: 1.5
        max_concurrent_positions: 1
        max_same_day_losses: 2
        after_first_loss_risk_multiplier: 0.5
        min_trade_risk_multiplier: 0.25
execution:
  magic: 8858
  slippage: 10
  # Global default: 45% trigger for all pairs. Override per symbol via
  # tf_overrides below — e.g. XAUUSD and US100 both diverge from it here.
  tp1_trigger_pct: 55.0
  tp1_percentage: 45.0
  move_sl_to_be_on_tp1: true
  breakeven_spread_multiplier: 1
  breakeven_max_buffer_pct_of_risk: 10.0
  tf_overrides:
    XAUUSD:
      "*":
        tp1_trigger_pct: 55.0
  spread_risk_multiplier: 1.0
  order_retry_count: 2
  order_retry_delay_sec: 0.5
  max_entry_slippage_pct_of_stop: 0.2
  max_signal_age_ms: 120000
  close_on_slippage_exceed: false
  adjust_levels_on_slippage: false
  # Fallback only — a signal's own limit_expiry_seconds (set by whichever
  # strategy requested a limit entry, e.g. pure_crt) always wins when
  # present. Only used if a signal somehow arrives with entry_type="limit"
  # but no expiry of its own.
  limit_order:
    expiry_seconds: 1800
  # On (default): a resting limit order rejected because price already
  # moved past it (retcode=10015 INVALID_PRICE) gets retried once as the
  # equivalent stop order at the same price/SL/TP/expiry, instead of just
  # being skipped. Turn off to go back to skip-only behavior.
  use_limit_to_stop_fallback: true
  # On (default): a resting order rejected with retcode=10022 INVALID_
  # EXPIRATION (seen live on XAUUSD) gets retried once as GTC (no
  # broker-side expiration) at the same price/SL/TP - PendingOrderManager's
  # own expiry tracking still cancels it on schedule either way.
  use_gtc_fallback_on_invalid_expiration: true
engine:
  timezone: UTC
  log_level: INFO
  storage_path: ./data/{profile}
  # monitoring_port: 8080  # left unset — auto-derives to 8091 for fbs
  position_poll_interval: 0.6

dashboard_hub:
  enabled: true
  url: "ws://127.0.0.1:8095"
  token: ""

startup:
  auto_start_engine: true
  minimise_on_start: false
