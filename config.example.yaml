signal_engine:
  ws_url: ws://localhost:8765
  symbols:
    - XAUUSD
    - US100
    - US30
mt5:
  # Selects a named profile from mt5-credentials.yaml (git-ignored - copy
  # from mt5-credentials.example.yaml). Omit `use` entirely to fall back to
  # putting login/password/server/path directly in this block instead
  # (password still accepts an MT5_PASSWORD env var either way).
  use: fbs

# Optional, broker-orthogonal risk override - deep-merges zconfig/<mode>.yaml
# (e.g. zconfig/conservative.yaml) on top of everything below, composing with
# whatever broker profile is active rather than being tied to one. RISK_MODE
# env var takes priority over this key if both are set. Omit entirely to keep
# today's risk block as the only source (no override applied).
# risk_mode: conservative

risk:
  # Aligned with signal-engine circuit_breaker.max_consecutive_losses=10.
  # Streak analysis (3yr, 5269 trades) proved losses are i.i.d. — stopping
  # at 3 was pausing the engine inside random variance with no edge benefit.
  max_losing_streak: 20
  max_daily_loss_percent: 100
  max_exposure_per_symbol: 2
  min_rr_ratio: 1.0
  max_lot_size: 100.0
  min_lot_size: 0.01
  sl_ratio_threshold: 0.35
  symbol_sl_ratio_threshold:
    # commodity — wider spread tolerance
    XAUUSD: 0.55
    # US100: measured against backtest data, not guessed. Median validated
    # trade sits at ~26% spread/SL, p25 at ~47% - a tighter threshold (e.g.
    # the generic "index" template value of 0.20) would reject the median
    # trade outright. Real spread-to-candle-range for US100 is at least as
    # good as XAUUSD's, not worse, so it gets the same threshold.
    US100: 0.55
    # US30: measured against its own 2-year backtest (30min/1h trades only,
    # matching its live TF-pair config). Median spread/SL ratio ~11.8%,
    # p90 ~34.2%, p95 ~52.4%, max ~72.3% - materially tighter than US100's
    # own distribution. Kept at the same 0.55 as XAUUSD/US100 for a
    # consistent, easy-to-reason-about policy; it only trims the worst
    # ~5% tail of US30's own validated trades, same margin of protection
    # the other two symbols get from this threshold.
    US30: 0.55
  # Per-symbol risk_amount multiplier (optional, defaults to 1.0 for any
  # symbol not listed) - composes with the cluster/equity-throttle
  # multipliers, applied in TradePlanner.plan(). Example only; not yet
  # calibrated against real per-symbol volatility data.
  symbol_risk_multiplier: {}
  # Balance-tiered risk ceiling (optional - defaults shown are also the
  # fallback if this whole section is omitted). Caps risk_amount at
  # balance * cap_pct/100 on top of the existing daily-budget sizing:
  # any balance <= base_threshold uses base_cap_pct; above it, the cap
  # halves for every doubling of balance, down to floor_pct.
  balance_tier_base_threshold: 500.0
  balance_tier_base_cap_pct: 5.0
  balance_tier_floor_pct: 0.05
  no_hedging: true
  # Profit drawdown guard — pauses until midnight if today's closed P&L gives
  # back this % of start-of-day equity from its session peak. Dormant until
  # the first profitable close (nothing to protect until gains are banked).
  # Set to 0 to disable.
  max_profit_drawdown_percent: 2.0
  rolling_window_size: 2
  rolling_drawdown_pct: 2.0
  # Equity-curve risk throttle — halves position risk while recent realized
  # results sit deep below their rolling peak, restoring full size on
  # recovery. Thresholds and window are platform-managed; `enabled` is the
  # only user-facing knob.
  equity_throttle:
    enabled: true
    drawdown_threshold_r: 8.0
    release_threshold_r: 6.0
    risk_multiplier: 0.5
    window_days: 30
  # Entry-drift diagnostic — measures how far the live fill price has moved
  # AGAINST the signal's own entry (a favorable move, e.g. a pullback before
  # a LONG fills, never counts), as % of the signal's own risk distance.
  # Always measured regardless of `enabled`; only rejects on that basis
  # (separately from min_rr_ratio) when enabled.
  entry_drift:
    enabled: false
    max_drift_pct_of_risk: 25.0
  cluster_risk:
    enabled: false
    groups:
      - name: forex
        symbols: [EURUSD, GBPUSD, USDJPY]
        max_same_day_loss_r: 2.0
        max_concurrent_positions: 3
        max_same_day_losses: 3
        after_first_loss_risk_multiplier: 0.75
        min_trade_risk_multiplier: 0.25
      - name: indices
        symbols: [US100, US30]
        max_same_day_loss_r: 1.5
        max_concurrent_positions: 1
        max_same_day_losses: 2
        after_first_loss_risk_multiplier: 0.5
        min_trade_risk_multiplier: 0.25
      - name: metals
        symbols: [XAUUSD]
        max_same_day_loss_r: 1.5
        max_concurrent_positions: 1
        max_same_day_losses: 2
        after_first_loss_risk_multiplier: 0.5
        min_trade_risk_multiplier: 0.25
execution:
  # MT5 order tagging / slippage tolerance - moved here from mt5: since both
  # are execution-behavior settings, not connection credentials.
  magic: 8858
  slippage: 10
  # Global default: 45% trigger for all pairs. Override per symbol via
  # tf_overrides below — e.g. XAUUSD and US100 both diverge from it here.
  # Post v0.2.0: LTF removed — tf_overrides use "*" wildcard TF (not "5/5").
  tp1_trigger_pct: 75.0
  tp1_percentage: 0.0
  move_sl_to_be_on_tp1: true
  breakeven_spread_multiplier: 1
  breakeven_max_buffer_pct_of_risk: 10.0
  tf_overrides:
    XAUUSD:
      "*":
        tp1_trigger_pct: 85.0

  spread_risk_multiplier: 1.0
  order_retry_count: 2
  order_retry_delay_sec: 0.5
  max_entry_slippage_pct_of_stop: 0.2
  max_signal_age_ms: 120000
  close_on_slippage_exceed: false
  adjust_levels_on_slippage: false
  # Fallback only — a signal's own limit_expiry_seconds (set by whichever
  # strategy requested a limit entry, e.g. Signal Engine's pure_crt) always
  # wins when present. Only used if a signal somehow arrives with
  # entry_type="limit" but no expiry of its own. Optional block; omitted
  # entirely defaults to 1800 (30 min).
  limit_order:
    expiry_seconds: 1800
engine:
  timezone: UTC
  log_level: INFO
  # {profile} is substituted with mt5.use/MT5_USE at load time — lets one
  # checkout run multiple per-broker instances (one Task Scheduler action
  # per broker, each setting MT5_USE) without colliding on the same
  # storage dir. Plain "./data" also still works for a single instance.
  storage_path: ./data/{profile}
  # Omit to auto-derive a per-broker default (fbs=8091, exness=8092,
  # fundednext=8093, deriv=8094, others deterministically 8100-8299) so
  # several instances sharing one checkout don't collide on the default 8080.
  # monitoring_port: 8080
  position_poll_interval: 0.6

# Optional: relay this instance's dashboard telemetry/commands through a hub
# (python -m src.hub — see src/hub) instead of the dashboard needing to know
# every instance's own monitoring_port directly. Purely additive — the
# monitoring_port above keeps serving direct connections unchanged either way.
dashboard_hub:
  enabled: false
  url: "ws://127.0.0.1:8095"
  token: ""

startup:
  auto_start_engine: true
  minimise_on_start: false
