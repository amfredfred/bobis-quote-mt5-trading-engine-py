# Copy to mt5-credentials.yaml and fill in real values. That file is
# git-ignored - never commit real credentials.
#
# One profile per broker, selected by config.yaml's mt5.use: <profile>
# (or the MT5_USE env var, which overrides mt5.use - lets one checkout
# run multiple per-broker instances without a separate config.yaml per
# broker). Same file name, same per-profile fields, same "config:"/
# "symbol_aliases" pattern as signal-engine's mt5-credentials.yaml -
# keep both in sync when adding or changing a broker.
#
# Required: login, password, server, terminal_path.
# Optional:
#   config         -- path to a broker-specific overlay (deep-merged over
#                     config.yaml at startup - e.g. deriv's symbol list).
#   symbol_aliases -- canonical symbol name -> broker's real MT5 name.
#                     Checked before resolve_symbol()'s fuzzy match, since
#                     some brokers rename a symbol entirely (Exness's
#                     US100 is "USTECz", not "US100" with a suffix).
#                     Always verify real names live via MT5 - never guess.
#   signal_broker  -- which broker's signal stream to subscribe to, when
#                     it differs from this profile's own name. The profile
#                     name (the mt5.use / MT5_USE value) is this instance's
#                     own identity for credentials/storage_path/monitoring
#                     port; signal_broker is what SignalConsumer filters
#                     the shared hub feed on. Omit it and it defaults to
#                     the profile name itself (today's one-account-per-
#                     broker behavior). Set it when adding a *second*
#                     account on a broker that already has a running
#                     signal-engine instance — the new account gets its own
#                     profile name (own credentials/logs/data folder) but
#                     still trades the existing broker's signals. See the
#                     "exness2" example below.

fbs:
  login: 00000000
  password: "your-mt5-password"
  server: "FBS-Demo"
  terminal_path: "C:\\Program Files\\FBS MetaTrader 5\\terminal64.exe"
  # Aggressive/base risk mode, kept explicit rather than omitted — see
  # zconfig/aggressive.yaml.
  config: zconfig/fbs.yaml

exness:
  login: 00000000
  password: "your-mt5-password"
  server: "Exness-MT5Trial10"
  terminal_path: "C:\\Program Files\\MetaTrader 5 EXNESS\\terminal64.exe"
  # Conservative risk mode — see zconfig/exness.yaml + zconfig/conservative.yaml.
  config: zconfig/exness.yaml
  symbol_aliases:
    US100: USTECz

fundednext:
  login: 00000000
  password: "your-mt5-password"
  server: "FundedNext-Server 3"
  terminal_path: "C:\\Program Files\\FundedNext MT5 Terminal\\terminal64.exe"
  # Conservative risk mode — see zconfig/fundednext.yaml + zconfig/conservative.yaml.
  config: zconfig/fundednext.yaml
  symbol_aliases:
    US100: NDX100

# Deriv's synthetic indices (Volatility/Boom/Crash) are named differently on
# their own MT5 server than this engine's canonical symbol names -- always
# verify real names via a live mt5.symbols_get() query before trusting
# guessed aliases (mixed case, contains spaces, easy to get wrong).
# Second Exness account, run as its own MT5 terminal install/profile (see
# the "Multi-account same broker" note), but trading the same "exness"
# signal stream rather than needing its own signal-engine instance.
exness2:
  login: 00000000
  password: "your-mt5-password"
  server: "Exness-MT5Trial10"
  terminal_path: "C:\\Program Files\\MetaTrader 5 EXNESS 2\\terminal64.exe"
  config: zconfig/exness.yaml
  signal_broker: exness
  symbol_aliases:
    US100: USTECz

deriv:
  login: 00000000
  password: "your-mt5-password"
  server: "Deriv-Demo"
  terminal_path: "C:\\Program Files\\MetaTrader 5 Terminal\\terminal64.exe"
  config: zconfig/deriv.yaml
  symbol_aliases:
    VOLATILITY10: "Volatility 10 Index"
    VOLATILITY50: "Volatility 50 Index"
    VOLATILITY75: "Volatility 75 Index"
    BOOM500: "Boom 500 Index"
    BOOM1000: "Boom 1000 Index"
    CRASH500: "Crash 500 Index"
    CRASH1000: "Crash 1000 Index"
