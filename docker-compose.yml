version: '3.8'

services:
  execution-engine:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    environment:
      - LOG_LEVEL=INFO
    depends_on:
      - mt5-terminal

  # Note: MetaTrader 5 terminal must run on host
  # This is just for reference
  mt5-terminal:
    image: placeholder
    # MT5 terminal needs to be installed on host system